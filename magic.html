<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>魔法の杖 アクションテスト(完成版)</title>
<style>
  body { font-family: 'Helvetica Neue', Arial, sans-serif; text-align: center; background-color: #1e272e; color: #d2dae2; padding: 20px; margin: 0; }
  h1 { font-size: 22px; color: #0fbcf9; margin-bottom: 5px; }
  p.sub { font-size: 12px; color: #808e9b; margin-top: 0; }
  .btn { display: inline-block; padding: 15px 25px; margin: 10px; font-size: 16px; font-weight: bold; color: #fff; background-color: #f53b57; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 3px rgba(0,0,0,0.3); }
  .mode-btn { background-color: #3c40c6; width: 90%; max-width: 320px; font-size: 14px; margin-top: 10px; padding: 12px; }
  #status-box { margin: 15px auto; padding: 20px; background: #2d3436; border-radius: 8px; font-size: 16px; line-height: 1.6; border: 2px solid #575fcf; min-height: 80px; }
  .highlight { color: #ffd32a; font-size: 20px; font-weight: bold; display: block; margin-top: 5px; }
  #clear-msg { display: none; margin: 20px auto; padding: 20px; background: #ffd32a; color: #1e272e; font-size: 24px; font-weight: bold; border-radius: 10px; animation: popup 0.5s ease-out; }
  #debug-info { margin-top: 20px; font-size: 11px; color: #808e9b; text-align: left; background: #000; padding: 10px; border-radius: 5px; }
  @keyframes popup { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>

  <h1>上級魔法使い アクションテスト</h1>
  <p class="sub">学園祭 謎解きイベント用システム</p>
  
  <div id="start-screen">
    <p>iPhoneの方は「許可」を押してください。</p>
    <button class="btn" id="start-btn">センサーを起動する</button>
  </div>

  <div id="main-screen" style="display: none;">
    <div id="status-box">下のボタンから<br>テストする魔法を選んでください</div>
    
    <button class="btn mode-btn" onclick="setMode(1)">① チャージ＆スラスト (垂直魔力溜め)</button>
    <button class="btn mode-btn" onclick="setMode(2)">② サークル＆タップ (3回叩く)</button>
    <button class="btn mode-btn" onclick="setMode(3)">③ ツイスト・アンロック (開錠の魔法)</button>

    <div id="clear-msg">✨ 魔法 発動成功！ ✨</div>
  </div>

  <div id="debug-info">センサー待機中...</div>

<script>
  let currentMode = 0;
  let sequenceStep = 0;
  let isCleared = false;

  // センサー計算用
  let lastAx = 0, lastAy = 0, lastAz = 0;
  let currentBeta = 0, currentGamma = 0; 
  
  // モード1用（チャージ）
  let chargeStartTime = 0;
  let isCharging = false;
  
  // モード2用（円とタップ）
  let accumulatedAngle = 0;
  let lastWandAngle = null;
  let tapCount = 0;
  let lastTapTime = 0;

  // モード3用（ツイスト）
  let twistStartTime = 0;

  const startBtn = document.getElementById('start-btn');
  const startScreen = document.getElementById('start-screen');
  const mainScreen = document.getElementById('main-screen');
  const statusBox = document.getElementById('status-box');
  const clearMsg = document.getElementById('clear-msg');
  const debugInfo = document.getElementById('debug-info');

  // センサー許可
  startBtn.addEventListener('click', async () => {
    try {
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        const p1 = await DeviceMotionEvent.requestPermission();
        if (p1 !== 'granted') { alert('加速度センサーを許可してください'); return; }
      }
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        const p2 = await DeviceOrientationEvent.requestPermission();
        if (p2 !== 'granted') { alert('ジャイロを許可してください'); return; }
      }
      startScreen.style.display = 'none';
      mainScreen.style.display = 'block';
      window.addEventListener('devicemotion', handleMotion, true);
      window.addEventListener('deviceorientation', handleOrientation, true);
    } catch (e) {
      alert('起動失敗。HTTPS環境で開いていますか？');
    }
  });

  function setMode(mode) {
    currentMode = mode;
    sequenceStep = 0;
    isCleared = false;
    clearMsg.style.display = 'none';
    
    isCharging = false; accumulatedAngle = 0; lastWandAngle = null; tapCount = 0; twistStartTime = 0;
    
    if (mode === 1) statusBox.innerHTML = '【モード1: チャージ＆スラスト】<br>スマホを「垂直」に立てて、2秒間静止しろ！';
    if (mode === 2) statusBox.innerHTML = '【モード2: サークル＆タップ】<br>空中で杖を回し、魔法陣（円）を描け！';
    if (mode === 3) statusBox.innerHTML = '【モード3: ツイスト・アンロック】<br>スマホの画面を上に向け、水平に持て。';
  }

  function showClear() {
    if (isCleared) return;
    isCleared = true;
    clearMsg.style.display = 'block';
    statusBox.innerHTML = '<span class="highlight">完璧な魔法だ！</span>';
    currentMode = 0;
  }

  // ジャイロ（傾き・回転）の判定
  function handleOrientation(event) {
    if (currentMode === 0 || isCleared) return;

    currentBeta = event.beta || 0;
    currentGamma = event.gamma || 0;

    // ② サークル＆タップの「サークル（円）」判定
    if (currentMode === 2 && sequenceStep === 0) {
      if (Math.abs(currentBeta) > 5 || Math.abs(currentGamma) > 5) {
        let currentWandAngle = Math.atan2(currentBeta, currentGamma) * (180 / Math.PI);
        if (lastWandAngle !== null) {
          let diff = currentWandAngle - lastWandAngle;
          if (diff > 180) diff -= 360;
          if (diff < -180) diff += 360;
          accumulatedAngle += Math.abs(diff);
          
          let progress = Math.min(100, Math.floor((accumulatedAngle / 320) * 100));
          statusBox.innerHTML = `【魔法陣（円）を描き中...】<br>進捗: ${progress}%`;

          if (accumulatedAngle > 320) { // ほぼ1周
            sequenceStep = 1;
            tapCount = 0;
            // 🛑 【修正箇所】円を描き終えた直後の「急ブレーキの衝撃」を無視するため、0.5秒間はタップを受け付けない
            lastTapTime = Date.now() + 500; 
            statusBox.innerHTML = '【魔法陣描画完了！】<br><span class="highlight">杖のお尻を「3回」トントンと叩け！</span>';
          }
        }
        lastWandAngle = currentWandAngle;
      }
    }

    // ③ ツイスト・アンロック（開錠）の「ひねり」判定
    if (currentMode === 3) {
      if (sequenceStep === 0) {
        // スマホを水平に持っているか（BetaとGammaがほぼ0）
        if (Math.abs(currentBeta) < 25 && Math.abs(currentGamma) < 25) {
          sequenceStep = 1;
          statusBox.innerHTML = '【ステップ1: 鍵穴を探る】<br>そのまま、ドアノブを回すように「右か左に90度」手首をひねれ！';
        }
      } else if (sequenceStep === 1) {
        // 左右どちらかに大きくひねったか（Gammaが60度以上傾いたか）
        if (Math.abs(currentGamma) > 60) {
          sequenceStep = 2;
          twistStartTime = Date.now();
          statusBox.innerHTML = '【ステップ2: 開錠】<br><span class="highlight">ひねった状態をキープしろ！(1秒)</span>';
        }
      } else if (sequenceStep === 2) {
        // ひねりを戻してしまったら失敗
        if (Math.abs(currentGamma) < 40) {
          sequenceStep = 1;
          statusBox.innerHTML = '失敗！ひねりが戻ってしまった。<br>もう一度やり直せ。';
        } else if (Date.now() - twistStartTime > 1000) {
          // 1秒間キープ成功
          sequenceStep = 3;
          statusBox.innerHTML = '【ステップ3: 扉を押し開く】<br><span class="highlight">そのまま前へ押し込め（突き出せ）！</span>';
        }
      }
    }
  }

  // 加速度（振る・止める・叩く）の判定
  function handleMotion(event) {
    if (currentMode === 0 || isCleared) return;

    let acc = event.acceleration;
    if (!acc || acc.x === null) acc = event.accelerationIncludingGravity;
    if (!acc) return;

    const ax = acc.x || 0, ay = acc.y || 0, az = acc.z || 0;
    const deltaA = Math.sqrt((ax - lastAx)**2 + (ay - lastAy)**2 + (az - lastAz)**2);
    
    lastAx = ax; lastAy = ay; lastAz = az;

    debugInfo.innerHTML = `衝撃(Delta): ${deltaA.toFixed(1)}<br>左右傾き(Gamma): ${currentGamma.toFixed(1)}<br>進捗ステップ: ${sequenceStep}`;

    // ① チャージ＆スラストの判定
    if (currentMode === 1) {
      if (sequenceStep === 0) {
        const isVertical = currentBeta > 60 && currentBeta < 120;
        if (deltaA < 0.8 && isVertical) {
          if (!isCharging) {
            isCharging = true; chargeStartTime = Date.now();
            statusBox.innerHTML = '【魔力チャージ中...】<br><span class="highlight">そのまま垂直をキープ！</span>';
          } else if (Date.now() - chargeStartTime > 2000) {
            sequenceStep = 1;
            statusBox.innerHTML = '【チャージ完了！】<br><span class="highlight">一気に前へ突き出せ！！</span>';
          }
        } else {
          if (isCharging) {
            isCharging = false;
            statusBox.innerHTML = isVertical ? '魔力が散ってしまった！<br>もう一度、完全に静止しろ！' : '杖が傾いている！<br>しっかりと垂直に立てて静止しろ！';
          }
        }
      } else if (sequenceStep === 1) {
        if (deltaA > 15) showClear();
        else if (Date.now() - chargeStartTime > 5000) setMode(1);
      }
    }

    // ② サークル＆タップの「3回タップ」判定
    if (currentMode === 2 && sequenceStep === 1) {
      if (deltaA > 6) { 
        let now = Date.now();
        // 🛑 前回タップから0.2秒以上経過している場合のみカウント（0.5秒のクールダウン中も弾く）
        if (now - lastTapTime > 200) { 
          tapCount++;
          lastTapTime = now;
          if (tapCount === 1) {
            statusBox.innerHTML = '【魔法陣描画完了！】<br><span class="highlight">トン！（あと2回！）</span>';
          } else if (tapCount === 2) {
            statusBox.innerHTML = '【魔法陣描画完了！】<br><span class="highlight">トントン！（あと1回！）</span>';
          } else if (tapCount >= 3) {
            showClear();
          }
        }
      }
    }

    // ③ ツイスト・アンロックの「押し込み」判定
    if (currentMode === 3 && sequenceStep === 3) {
      if (deltaA > 12) { // 前方への強い押し込み（衝撃）を検知
        showClear();
      }
    }
  }
</script>
</body>
</html>
