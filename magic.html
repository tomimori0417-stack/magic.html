<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>魔法の杖 動作テスト</title>
<style>
  body { font-family: 'Helvetica Neue', Arial, sans-serif; text-align: center; background-color: #2c3e50; color: #ecf0f1; padding: 20px; margin: 0; }
  h1 { font-size: 24px; color: #f1c40f; }
  .btn { display: inline-block; padding: 15px 25px; margin: 10px; font-size: 16px; font-weight: bold; color: #fff; background-color: #e74c3c; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 3px rgba(0,0,0,0.3); }
  .mode-btn { background-color: #3498db; width: 80%; max-width: 300px; }
  #status-box { margin: 20px auto; padding: 15px; background: #34495e; border-radius: 8px; font-size: 18px; line-height: 1.5; border: 2px solid #7f8c8d; }
  #clear-msg { display: none; margin: 20px auto; padding: 20px; background: #f1c40f; color: #c0392b; font-size: 28px; font-weight: bold; border-radius: 10px; animation: popup 0.5s ease-out; }
  #debug-info { margin-top: 20px; font-size: 12px; color: #95a5a6; text-align: left; background: #1a252f; padding: 10px; border-radius: 5px; }
  @keyframes popup { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>

  <h1>見習い魔法使い 杖テスト</h1>
  
  <div id="start-screen">
    <p>iPhoneの方は「許可」を押してください。</p>
    <button class="btn" id="start-btn">センサーを起動する</button>
  </div>

  <div id="main-screen" style="display: none;">
    <div id="status-box">下のボタンから<br>テストする魔法を選んでください</div>
    
    <button class="btn mode-btn" onclick="setMode(1)">① 単純に振る魔法</button>
    <button class="btn mode-btn" onclick="setMode(2)">② 振り下ろす魔法</button>
    <button class="btn mode-btn" onclick="setMode(3)">③ 垂直→水平→円の魔法</button>

    <div id="clear-msg">✨ 魔法成功！クリア！ ✨</div>
  </div>

  <div id="debug-info">センサー待機中...</div>

<script>
  let currentMode = 0;
  let sequenceStep = 0;
  let accumulatedAngle = 0;
  let lastWandAngle = null;
  let isCleared = false;

  const startBtn = document.getElementById('start-btn');
  const startScreen = document.getElementById('start-screen');
  const mainScreen = document.getElementById('main-screen');
  const statusBox = document.getElementById('status-box');
  const clearMsg = document.getElementById('clear-msg');
  const debugInfo = document.getElementById('debug-info');

  // 1. センサーの許可要求（iOS 13+ 対応）
  startBtn.addEventListener('click', async () => {
    try {
      // 加速度センサーの許可
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        const p1 = await DeviceMotionEvent.requestPermission();
        if (p1 !== 'granted') { alert('加速度センサーが許可されませんでした。'); return; }
      }
      // ジャイロセンサーの許可
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        const p2 = await DeviceOrientationEvent.requestPermission();
        if (p2 !== 'granted') { alert('ジャイロセンサーが許可されませんでした。'); return; }
      }
      
      startScreen.style.display = 'none';
      mainScreen.style.display = 'block';
      
      window.addEventListener('devicemotion', handleMotion, true);
      window.addEventListener('deviceorientation', handleOrientation, true);
    } catch (e) {
      alert('センサーの起動に失敗しました。HTTPS環境で開いているか確認してください。');
    }
  });

  // モードの切り替え
  function setMode(mode) {
    currentMode = mode;
    sequenceStep = 0;
    accumulatedAngle = 0;
    lastWandAngle = null;
    isCleared = false;
    clearMsg.style.display = 'none';
    
    if (mode === 1) statusBox.innerHTML = '【モード1】<br>スマホをシャカシャカ強く振れ！';
    if (mode === 2) statusBox.innerHTML = '【モード2】<br>スマホを縦に持ち、上から下へ鋭く振り下ろせ！';
    if (mode === 3) statusBox.innerHTML = '【モード3】<br>ステップ1: スマホを「垂直」に立てろ！';
  }

  // クリア演出
  function showClear() {
    if (isCleared) return;
    isCleared = true;
    clearMsg.style.display = 'block';
    statusBox.innerHTML = 'お見事！魔法が発動しました。';
    currentMode = 0; // 判定をストップ
  }

  // 2. 加速度の判定（振る、振り下ろす）
  function handleMotion(event) {
    if (currentMode === 0 || isCleared) return;

    // Androidの機種依存対策（重力抜きを優先し、無ければ重力込みを使う）
    let acc = event.acceleration;
    if (!acc || acc.x === null) {
      acc = event.accelerationIncludingGravity;
    }
    if (!acc) return;

    const ax = acc.x || 0;
    const ay = acc.y || 0;
    const az = acc.z || 0;
    const totalAcc = Math.sqrt(ax*ax + ay*ay + az*az);

    debugInfo.innerHTML = `【加速度】<br>X: ${ax.toFixed(1)} / Y: ${ay.toFixed(1)} / Z: ${az.toFixed(1)}<br>合計: ${totalAcc.toFixed(1)}`;

    if (currentMode === 1) {
      // ① 単純に振る（合計の加速度が20を超えたら）
      if (totalAcc > 20) {
        showClear();
      }
    } else if (currentMode === 2) {
      // ② 上から下に振る（Y軸の加速度が大きく、かつ他の軸より目立っているか）
      if (Math.abs(ay) > 15 && Math.abs(ay) > Math.abs(ax) * 1.5 && totalAcc > 18) {
        showClear();
      }
    }
  }

  // 3. ジャイロ（傾き）の判定（垂直→水平→円）
  function handleOrientation(event) {
    if (currentMode !== 3 || isCleared) return;

    const beta = event.beta || 0;   // 前後の傾き (-180〜180)
    const gamma = event.gamma || 0; // 左右の傾き (-90〜90)

    debugInfo.innerHTML = `【傾き】<br>前後(Beta): ${beta.toFixed(1)}<br>左右(Gamma): ${gamma.toFixed(1)}<br>進捗: ステップ ${sequenceStep}`;

    if (sequenceStep === 0) {
      // ステップ1: 垂直（スマホを立てている状態。Betaが70〜110度）
      if (beta > 70 && beta < 110) {
        sequenceStep = 1;
        statusBox.innerHTML = '【モード3】<br>ステップ2: スマホを机に置くように「水平」にしろ！';
      }
    } else if (sequenceStep === 1) {
      // ステップ2: 水平（BetaもGammaもほぼ0度）
      if (Math.abs(beta) < 20 && Math.abs(gamma) < 20) {
        sequenceStep = 2;
        lastWandAngle = null;
        accumulatedAngle = 0;
        statusBox.innerHTML = '【モード3】<br>ステップ3: そのまま手首を使って杖の先で「円」を描け！';
      }
    } else if (sequenceStep === 2) {
      // ステップ3: 円を描く（BetaとGammaの変化から、傾きの角度を計算して円運動を検知）
      // 少し傾いていないと角度が計算できないため、傾きがあるかチェック
      if (Math.abs(beta) > 5 || Math.abs(gamma) > 5) {
        // 現在の傾き方向（角度）を計算（-180度 〜 180度）
        let currentWandAngle = Math.atan2(beta, gamma) * (180 / Math.PI);
        
        if (lastWandAngle !== null) {
          let diff = currentWandAngle - lastWandAngle;
          
          // 角度が180度から-180度へ切り替わる境界をまたいだ時の補正
          if (diff > 180) diff -= 360;
          if (diff < -180) diff += 360;
          
          accumulatedAngle += Math.abs(diff); // 動かした角度を足していく
          
          // 約1周（300度）回したらクリア判定（少し甘めに設定）
          if (accumulatedAngle > 300) {
            showClear();
          }
        }
        lastWandAngle = currentWandAngle;
      }
    }
  }
</script>
</body>
</html>
